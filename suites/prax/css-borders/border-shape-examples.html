<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>border-shape: the specification's examples</title>
<link rel=stylesheet href=../shared/page.css>
<style>
  figure { margin-right: 10px; }
  .box { margin: 10px; background: #f9cc9d; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>CSS Borders and Box Decorations 4 · 7.4 Examples</div>
  <h1>border-shape: the specification's examples</h1>
  <p class=pr-lede>The examples of <span class=pr-cite><a href="https://drafts.csswg.org/css-borders-4/#border-shape-examples">CSS Borders and Box Decorations 4 §7.4</a></span>, at the stage's size.</p>
</header>

<section>
  <h2>Circle, diamond, heart</h2>
  <figure class=pr-erratum>
    <div class="pr-stage pr-medium"><div class="box" style="width: 80px; height: 80px; border: 5px solid #2c5a8f; border-shape: circle(50%)"></div></div>
    <figcaption>A circular border with a 5px stroke. <span class=pr-flag>Safari</span> <span class=pr-flag>Firefox</span> A rectangular border.</figcaption>
  </figure>
  <figure class=pr-erratum>
    <div class="pr-stage pr-medium"><div class="box" style="width: 100px; height: 100px; border: 10px solid crimson; border-shape: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%) polygon(50% 10%, 90% 50%, 50% 90%, 10% 50%)"></div></div>
    <figcaption>A diamond border between two polygons, crimson. <span class=pr-flag>Safari</span> <span class=pr-flag>Firefox</span> A rectangular border.</figcaption>
  </figure>
  <figure class=pr-erratum>
    <div class="pr-stage pr-medium"><div class="box" style="width: 84px; height: 84px; border: 8px solid green; border-shape: path('M 10,30 A 20,20 0,0,1 50,30 A 20,20 0,0,1 90,30 Q 90,60 50,90 Q 10,60 10,30 z')"></div></div>
    <figcaption>A heart-shaped border from a path, green. <span class=pr-flag>Safari</span> <span class=pr-flag>Firefox</span> A rectangular border.</figcaption>
  </figure>
</section>

</body>
</html>
