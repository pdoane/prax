<?xml version="1.0" encoding="UTF-8"?>
<!-- Texts whose language a :lang() rule colors: French orange, German green. The second has both a lang and an
     xml:lang, which differ; xml:lang decides. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="60" font-family="sans-serif" font-size="20" font-weight="700">
  <style>
    text { fill: #2c5a8f; }
    text:lang(fr) { fill: #d68a3c; }
    text:lang(de) { fill: #6aa36a; }
  </style>
  <text x="10" y="35" xml:lang="fr">fr</text>
  <text x="80" y="35" lang="de" xml:lang="fr">both</text>
</svg>
