<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- The same mask border image in luminance: white discs in the four 10px corners, white bars 4px thick along the
       four 10px edges, and a 4px white square in the middle, all on opaque black. -->
  <rect width="30" height="30" fill="black"/>
  <g fill="white">
    <circle cx="5" cy="5" r="5"/>
    <circle cx="25" cy="5" r="5"/>
    <circle cx="5" cy="25" r="5"/>
    <circle cx="25" cy="25" r="5"/>
    <rect x="10" y="3" width="10" height="4"/>
    <rect x="10" y="23" width="10" height="4"/>
    <rect x="3" y="10" width="4" height="10"/>
    <rect x="23" y="10" width="4" height="10"/>
    <rect x="13" y="13" width="4" height="4"/>
  </g>
</svg>
