<svg xmlns="http://www.w3.org/2000/svg" width="100" height="70" viewBox="0 0 100 70">
  <!-- Opaque throughout: black at the left, mid grey in the middle, white at the right. As an alpha mask it keeps all
       of it; as a luminance mask it keeps nothing at the left, half in the middle and all at the right. -->
  <rect width="34" height="70" fill="black"/>
  <rect x="34" width="33" height="70" fill="rgb(50% 50% 50%)"/>
  <rect x="67" width="33" height="70" fill="white"/>
</svg>
