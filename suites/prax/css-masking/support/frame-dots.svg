<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- A mask border image whose 10px edge pieces each hold one opaque dot 6px across, so that tiling them shows: a
       stretched dot is an ellipse, a repeated one a row of dots. The corners are opaque squares; the middle is empty. -->
  <rect width="10" height="10"/>
  <rect x="20" width="10" height="10"/>
  <rect y="20" width="10" height="10"/>
  <rect x="20" y="20" width="10" height="10"/>
  <circle cx="15" cy="5" r="3"/>
  <circle cx="15" cy="25" r="3"/>
  <circle cx="5" cy="15" r="3"/>
  <circle cx="25" cy="15" r="3"/>
</svg>
