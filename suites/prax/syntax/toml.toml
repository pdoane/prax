# A crate's manifest, with features, a dependency table and a release profile.
[package]
name = "ring"
version = "1.2.0"
edition = "2021"
authors = ["Ada <ada@example.com>"]
description = """
A ring buffer of bytes, \
with no allocation after it is made."""
license = 'MIT OR Apache-2.0'

[features]
default = ["std"]
std = []
metal = ["dep:metal"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
metal = { version = "0.29", optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[[bench]]
name = "throughput"
harness = false

[package.metadata.limits]
capacity = 64
ratio = 0.75
exponent = 1.5e-3
built = 2026-11-05T09:30:00Z
