<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Examples of HWB colors</title>
<link rel=stylesheet href=../shared/page.css>
<style>
  .t { border-collapse: collapse; margin: 0 0 10px; }
  .t th { padding: 0 4px; color: #6b7381; font: 11px/14px ui-monospace, Menlo, monospace; font-weight: normal; }
  .t td { width: 40px; height: 40px; padding: 0; }
  section figure { margin-right: 24px; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>CSS Color 4 · 8.3 Examples of HWB Colors</div>
  <h1>Examples of HWB colors</h1>
  <p class=pr-lede>The section is not
  normative: tables of <code>hwb()</code> colors, whiteness in rows, blackness in columns. <span class=pr-cite><a href="https://drafts.csswg.org/css-color-4/#hwb-examples">CSS Color 4 §8.3</a></span></p>
</header>

<section>
  <h2>0° reds and 210° blues</h2>
  <figure>
    <table class=t><tr><th>W\B</th><th>0%</th><th>25%</th><th>50%</th><th>75%</th><th>100%</th></tr>
      <tr><th>0%</th><td style="background: hwb(0 0% 0%)"></td><td style="background: hwb(0 0% 25%)"></td><td style="background: hwb(0 0% 50%)"></td><td style="background: hwb(0 0% 75%)"></td><td style="background: hwb(0 0% 100%)"></td></tr>
      <tr><th>25%</th><td style="background: hwb(0 25% 0%)"></td><td style="background: hwb(0 25% 25%)"></td><td style="background: hwb(0 25% 50%)"></td><td style="background: hwb(0 25% 75%)"></td><td style="background: hwb(0 25% 100%)"></td></tr>
      <tr><th>50%</th><td style="background: hwb(0 50% 0%)"></td><td style="background: hwb(0 50% 25%)"></td><td style="background: hwb(0 50% 50%)"></td><td style="background: hwb(0 50% 75%)"></td><td style="background: hwb(0 50% 100%)"></td></tr>
      <tr><th>75%</th><td style="background: hwb(0 75% 0%)"></td><td style="background: hwb(0 75% 25%)"></td><td style="background: hwb(0 75% 50%)"></td><td style="background: hwb(0 75% 75%)"></td><td style="background: hwb(0 75% 100%)"></td></tr>
      <tr><th>100%</th><td style="background: hwb(0 100% 0%)"></td><td style="background: hwb(0 100% 25%)"></td><td style="background: hwb(0 100% 50%)"></td><td style="background: hwb(0 100% 75%)"></td><td style="background: hwb(0 100% 100%)"></td></tr>
    </table>
    <figcaption>0°: the pure hue at the top left, whiter down, darker to the right; plain grays where W + B reaches
    100%, on and below the diagonal from top right to bottom left.</figcaption>
  </figure>
  <figure>
    <table class=t><tr><th>W\B</th><th>0%</th><th>25%</th><th>50%</th><th>75%</th><th>100%</th></tr>
      <tr><th>0%</th><td style="background: hwb(210 0% 0%)"></td><td style="background: hwb(210 0% 25%)"></td><td style="background: hwb(210 0% 50%)"></td><td style="background: hwb(210 0% 75%)"></td><td style="background: hwb(210 0% 100%)"></td></tr>
      <tr><th>25%</th><td style="background: hwb(210 25% 0%)"></td><td style="background: hwb(210 25% 25%)"></td><td style="background: hwb(210 25% 50%)"></td><td style="background: hwb(210 25% 75%)"></td><td style="background: hwb(210 25% 100%)"></td></tr>
      <tr><th>50%</th><td style="background: hwb(210 50% 0%)"></td><td style="background: hwb(210 50% 25%)"></td><td style="background: hwb(210 50% 50%)"></td><td style="background: hwb(210 50% 75%)"></td><td style="background: hwb(210 50% 100%)"></td></tr>
      <tr><th>75%</th><td style="background: hwb(210 75% 0%)"></td><td style="background: hwb(210 75% 25%)"></td><td style="background: hwb(210 75% 50%)"></td><td style="background: hwb(210 75% 75%)"></td><td style="background: hwb(210 75% 100%)"></td></tr>
      <tr><th>100%</th><td style="background: hwb(210 100% 0%)"></td><td style="background: hwb(210 100% 25%)"></td><td style="background: hwb(210 100% 50%)"></td><td style="background: hwb(210 100% 75%)"></td><td style="background: hwb(210 100% 100%)"></td></tr>
    </table>
    <figcaption>210°: the pure hue at the top left, whiter down, darker to the right; plain grays where W + B reaches
    100%, on and below the diagonal from top right to bottom left.</figcaption>
  </figure>
</section>

</body>
</html>
