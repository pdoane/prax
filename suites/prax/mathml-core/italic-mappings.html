<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The italic mappings</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .pr-stage { padding: 10px 6px; box-sizing: border-box; font-size: 24px; line-height: normal; }
  .pr-stage { font-size: 26px; }
  .pr-stage math { font-family: 'PR Noto Sans Math'; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>MathML Core · C.1 italic mappings</div>
  <h1>The italic mappings</h1>
  <p class=pr-lede>The table of <q>italic mappings</q> that <code>math-auto</code> uses. <span class=pr-cite><a href="https://w3c.github.io/mathml-core/#italic-mappings">MathML Core §C.1</a></span> Each row is a list of one-letter <code>mi</code> elements, in PR Noto Sans Math.</p>
</header>

<section>
  <h2>Latin and Greek</h2>
  <figure class=pr-wide>
    <div class="pr-stage pr-wide"><math><mi>a</mi><mi>b</mi><mi>g</mi><mi>h</mi><mi>z</mi><mi>A</mi><mi>B</mi><mi>Z</mi></math></div>
    <figcaption>a b g h z A B Z, italic; h as ℎ U+210E PLANCK CONSTANT, which stands in the Unicode block's hole.</figcaption>
  </figure>
  <figure class=pr-wide>
    <div class="pr-stage pr-wide"><math><mi>α</mi><mi>β</mi><mi>ω</mi><mi>Γ</mi><mi>Ω</mi><mi>ϵ</mi><mi>ϑ</mi><mi>ϕ</mi><mi>ϖ</mi></math></div>
    <figcaption>α β ω Γ Ω and the variants ϵ ϑ ϕ ϖ, italic.</figcaption>
  </figure>
</section>

<section>
  <h2>Dotless letters and symbols</h2>
  <figure class=pr-wide>
    <div class="pr-stage pr-wide"><math><mi>ı</mi><mi>ȷ</mi><mi>∇</mi><mi>∂</mi><mi>ϴ</mi><mi>Ϝ</mi></math></div>
    <figcaption>ı and ȷ to the italic dotless 𝚤 𝚥; ∇ and ∂ to 𝛻 and 𝜕; ϴ italic; Ϝ, in no row, upright.</figcaption>
  </figure>
</section>

</body>
</html>
