<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Tabular math: a matrix</title>
<link rel=stylesheet href=../shared/page.css>
<style>
  .pr-stage { padding: 10px 6px; box-sizing: border-box; font-size: 24px; line-height: normal; }
  .pr-stage { font-size: 28px; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>MathML Core · 3.5 Tabular Math</div>
  <h1>Tabular math: a matrix</h1>
  <p class=pr-lede><q>Matrices, arrays and other table-like mathematical notation are marked up using mtable mtr mtd elements.</q>
  <q>Note that it is vertically centered with the fraction bar and the middle of the equal sign.</q> <span class=pr-cite><a href="https://w3c.github.io/mathml-core/#tabular-math">MathML Core §3.5</a></span></p>
</header>

<section>
  <h2>The specification's example</h2>
  <figure class=pr-wide>
    <div class="pr-stage pr-wide"><math><mfrac><mi>A</mi><mn>2</mn></mfrac><mo>=</mo><mrow><mo>(</mo><mtable><mtr><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>5</mn></mtd><mtd><mn>6</mn></mtd></mtr><mtr><mtd><mn>7</mn></mtd><mtd><mn>8</mn></mtd><mtd><mn>9</mn></mtd></mtr></mtable><mo>)</mo></mrow></math></div>
    <figcaption>A over 2 = a 3 by 3 matrix of 1 to 9 in parentheses stretched to it, its middle row level with the bar and the =.</figcaption>
  </figure>
</section>

</body>
</html>
