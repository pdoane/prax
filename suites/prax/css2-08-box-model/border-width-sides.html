<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Border width: each side</title>
<link rel=stylesheet href=../shared/page.css>
</head>
<body>
<header>
  <div class=pr-eyebrow>CSS 2 · 8.5.1 Border width</div>
  <h1>Border width: each side</h1>
  <p class=pr-lede><code>border-*-width</code> and <code>border-width</code> take <code>thin | medium | thick | &lt;length&gt;</code>. Every figure's border is solid unless it says otherwise.</p>
</header>

<section>
  <h2>Each side</h2>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-style: solid; border-width: 0; border-top-width: 10px"></div></div>
    <figcaption><code>border-top-width: 10px</code>, the others 0.</figcaption>
  </figure>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-style: solid; border-width: 0; border-right-width: 10px"></div></div>
    <figcaption><code>border-right-width: 10px</code></figcaption>
  </figure>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-style: solid; border-width: 0; border-bottom-width: 10px"></div></div>
    <figcaption><code>border-bottom-width: 10px</code></figcaption>
  </figure>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-style: solid; border-width: 0; border-left-width: 10px"></div></div>
    <figcaption><code>border-left-width: 10px</code></figcaption>
  </figure>
</section>

</body>
</html>
