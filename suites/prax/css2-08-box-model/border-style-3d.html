<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Border style: the 3D values</title>
<link rel=stylesheet href=../shared/page.css>
</head>
<body>
<header>
  <div class=pr-eyebrow>CSS 2 · 8.5.3 Border style</div>
  <h1>Border style: the 3D values</h1>
  <p class=pr-lede><code>border-*-style</code> and <code>border-style</code> take <code>none | hidden | dotted | dashed | solid | double | groove | ridge | inset | outset</code>.</p>
</header>

<section>
  <h2>The 3D values</h2>
  <p>Four styles that draw the border in shades of its color. <span class=pr-cite><a href="https://drafts.csswg.org/css2/#border-style-properties">CSS 2 §8.5.3</a></span></p>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-width: 10px; border-style: groove"></div></div>
    <figcaption><code>groove</code>: <q>The border looks as though it were carved into the canvas.</q></figcaption>
  </figure>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-width: 10px; border-style: ridge"></div></div>
    <figcaption><code>ridge</code>: <q>The opposite of 'groove': the border looks as though it were coming out of the
    canvas.</q></figcaption>
  </figure>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-width: 10px; border-style: inset"></div></div>
    <figcaption><code>inset</code>: <q>The border makes the box look as though it were embedded in the
    canvas.</q></figcaption>
  </figure>
  <figure>
    <div class=pr-stage style="padding: 10px"><div class=pr-plain style="border-width: 10px; border-style: outset"></div></div>
    <figcaption><code>outset</code>: <q>The opposite of 'inset': the border makes the box look as though it were coming
    out of the canvas.</q></figcaption>
  </figure>
</section>

</body>
</html>
