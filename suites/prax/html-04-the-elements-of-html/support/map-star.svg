<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <!-- A five-pointed star drawn as one self-intersecting polygon and filled by the even-odd rule, so that the pentagon
       in its middle is a hole. -->
  <rect width="200" height="100" fill="#f4f5f7"/>
  <polygon points="100,5 126,90 57,37 143,37 74,90" fill="#8e44ad" fill-rule="evenodd"/>
</svg>
