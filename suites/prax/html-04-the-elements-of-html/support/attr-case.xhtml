<?xml version="1.0" encoding="utf-8"?>
<!-- An HTML element in an XML document: attr() compares an attribute's name in its own case. -->
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<style>
  body { margin: 0; padding: 10px; background: #e7eaef; color: #1f2430; font: 12px/18px ui-monospace, Menlo, monospace; }
  p { margin: 0 0 4px; padding: 0 6px; background: #d5d9e0; }
  .upper::before { content: "[" attr(DATA-LABEL) "] "; color: #3f7a3f; font-weight: 600; }
  .lower::before { content: "[" attr(data-label) "] "; color: #3f7a3f; font-weight: 600; }
</style>
</head>
<body>
<p class="upper" data-label="found">DATA-LABEL</p>
<p class="lower" data-label="found">data-label</p>
</body>
</html>
