<?xml version="1.0" encoding="utf-8"?>
<!-- HTML elements in an XML document: selectors compare their names and their attributes' names in their own case. -->
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<style>
  body { margin: 0; padding: 10px; background: #e7eaef; color: #1f2430; font: 12px/16px ui-monospace, Menlo, monospace; }
  p { margin: 0 0 2px; padding: 0 6px; background: #d5d9e0; }
  P.one, [DATA-K], p.three { background: #8fd18f; }
</style>
</head>
<body>
<p class="one">P.one</p>
<p data-k="">[DATA-K]</p>
<p class="three">p.three</p>
</body>
</html>
