<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <!-- The image of an image map whose areas overlap: a blue rectangle, an orange one over it from x 70 to 100, and a
       dashed grey hole in the blue one. -->
  <rect width="200" height="100" fill="#f4f5f7"/>
  <rect x="10" y="10" width="90" height="80" fill="#4f81bd"/>
  <rect x="70" y="20" width="110" height="60" fill="#d68a3c" fill-opacity="0.85"/>
  <rect x="30" y="35" width="20" height="30" fill="#f4f5f7" stroke="#6b7381" stroke-dasharray="3 2"/>
</svg>
