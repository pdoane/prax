<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The cite element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.6 The cite element</div>
  <h1>The cite element</h1>
  <p class=pr-lede><q>The cite element represents the title of a work</q>. <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-cite-element">HTML §4.5.6</a></span></p>
</header>
<section>
  <h2>In italics</h2>
  <p><q>cite, dfn, em, i, var { font-style: italic; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">I read <cite>Middlemarch</cite> twice.</div>
    <figcaption>"Middlemarch" in italics, the rest upright.</figcaption>
  </figure>
</section>
</body>
</html>
