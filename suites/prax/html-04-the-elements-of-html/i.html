<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The i element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.20 The i element</div>
  <h1>The i element</h1>
  <p class=pr-lede><q>The i element represents a span of text in an alternate voice or mood, or otherwise offset from the normal prose in a manner indicating a different quality of text</q>. <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-i-element">HTML §4.5.20</a></span></p>
</header>
<section>
  <h2>In italics</h2>
  <p><q>cite, dfn, em, i, var { font-style: italic; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">The ship <i>Endurance</i> sank.</div>
    <figcaption>"Endurance" in italics, the rest upright.</figcaption>
  </figure>
</section>
</body>
</html>
