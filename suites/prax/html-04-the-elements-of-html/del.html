<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The del element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.7.2 The del element</div>
  <h1>The del element</h1>
  <p class=pr-lede><q>The del element represents a removal from the document.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/edits.html#the-del-element">HTML §4.7.2</a></span></p>
</header>
<section>
  <h2>Struck through</h2>
  <p><q>del, s, strike { text-decoration: line-through; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">Doors open at <del>six</del> <ins>seven</ins>.</div>
    <figcaption>A line through "six"; "seven" underlined.</figcaption>
  </figure>
</section>
</body>
</html>
