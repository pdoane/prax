<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The var element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.16 The var element</div>
  <h1>The var element</h1>
  <p class=pr-lede><q>The var element represents a variable.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-var-element">HTML §4.5.16</a></span></p>
</header>
<section>
  <h2>In italics</h2>
  <p><q>cite, dfn, em, i, var { font-style: italic; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">If <var>n</var> is 3, <var>n</var>² is 9.</div>
    <figcaption>Both "n" in italics, the rest upright.</figcaption>
  </figure>
</section>
</body>
