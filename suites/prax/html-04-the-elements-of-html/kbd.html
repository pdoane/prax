<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The kbd element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.18 The kbd element</div>
  <h1>The kbd element</h1>
  <p class=pr-lede><q>The kbd element represents user input (typically keyboard input, although it may also be used to represent other input, such as voice commands).</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-kbd-element">HTML §4.5.18</a></span></p>
</header>
<section>
  <h2>Monospace</h2>
  <p><q>code, kbd, samp, tt { font-family: monospace; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">Press <kbd><kbd>Ctrl</kbd>+<kbd>C</kbd></kbd>.</div>
    <figcaption>"Ctrl+C" in a monospace font.</figcaption>
  </figure>
</section>
</body>
</html>
