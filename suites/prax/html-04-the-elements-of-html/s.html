<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The s element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.5 The s element</div>
  <h1>The s element</h1>
  <p class=pr-lede><q>The s element represents contents that are no longer accurate or no longer relevant.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-s-element">HTML §4.5.5</a></span></p>
</header>
<section>
  <h2>Struck through</h2>
  <p><q>del, s, strike { text-decoration: line-through; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">Price: <s>$40</s> $30</div>
    <figcaption>A line through "$40".</figcaption>
  </figure>
</section>
</body>
</html>
