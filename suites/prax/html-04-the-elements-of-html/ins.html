<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The ins element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.7.1 The ins element</div>
  <h1>The ins element</h1>
  <p class=pr-lede><q>The ins element represents an addition to the document.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/edits.html#the-ins-element">HTML §4.7.1</a></span></p>
</header>
<section>
  <h2>Underlined</h2>
  <p><q>ins, u { text-decoration: underline; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">Doors open at <ins>seven</ins>.</div>
    <figcaption>"seven" underlined.</figcaption>
  </figure>
</section>
</body>
</html>
