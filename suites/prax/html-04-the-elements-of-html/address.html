<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The address element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
  .t address { background: rgba(79, 129, 189, 0.16); }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.3.10 The address element</div>
  <h1>The address element</h1>
  <p class=pr-lede><q>The address element represents the contact information for its nearest article or body element
  ancestor.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/sections.html#the-address-element">HTML §4.3.10</a></span></p>
</header>
<section>
  <h2>A block, in italics</h2>
  <p>The user agent's style sheet makes it a block, and <q>address { font-style: italic; }</q>
  <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#flow-content-3">§15.3.3</a></span></p>
  <figure>
    <div class="pr-stage t">Written by<address>jo@example.com</address>in 2026.</div>
    <figcaption>Three lines: "Written by" upright, the tinted address in italics across the stage's width, and "in
    2026." upright.</figcaption>
  </figure>
</section>
</body>
</html>
