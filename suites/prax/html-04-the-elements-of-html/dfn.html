<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The dfn element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.8 The dfn element</div>
  <h1>The dfn element</h1>
  <p class=pr-lede><q>The dfn element represents the defining instance of a term.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-dfn-element">HTML §4.5.8</a></span></p>
</header>
<section>
  <h2>In italics</h2>
  <p><q>cite, dfn, em, i, var { font-style: italic; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">A <dfn>palindrome</dfn> reads the same backwards.</div>
    <figcaption>"palindrome" in italics, the rest upright.</figcaption>
  </figure>
</section>
</body>
</html>
