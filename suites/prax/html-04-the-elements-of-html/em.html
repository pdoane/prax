<title>The em element</title>
<link rel=stylesheet href=../shared/page.css>

<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>

<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.2 The em element</div>
  <h1>The em element</h1>
  <p class=pr-lede><q>The em element represents stress emphasis of its contents.</q> <q>The level of stress that a particular piece of content has is given by its number of ancestor em elements.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-em-element">HTML §4.5.2</a></span></p>
</header>
<section>
  <h2>In italics</h2>
  <p><q>cite, dfn, em, i, var { font-style: italic; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">Not <em>that</em> one, <em>this <em>one</em></em>.</div>
    <figcaption>"that" and "this one" in italics, the rest upright; the nested em is no different from its parent.</figcaption>
  </figure>
</section>
</body>
</html>
