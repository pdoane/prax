<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>The mark element</title>
<link rel=stylesheet href=../shared/page.css>
<link rel=stylesheet href=../shared/fonts.css>
<style>
  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.23 The mark element</div>
  <h1>The mark element</h1>
  <p class=pr-lede><q>The mark element represents a run of text in one document marked or highlighted for reference purposes, due to its relevance in another context.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-mark-element">HTML §4.5.23</a></span></p>
</header>
<section>
  <h2>Yellow behind black</h2>
  <p><q>mark { background: yellow; color: black; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t"><span style="color: #2c5a8f">Find <mark>this</mark> word.</span></div>
    <figcaption>"this" in black on yellow; the rest of the text is blue.</figcaption>
  </figure>
</section>
</body>
</html>
