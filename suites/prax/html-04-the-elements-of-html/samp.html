  .t { padding: 0 10px; font: 13px/20px "PR Noto Sans"; }

<body>
<header>
  <div class=pr-eyebrow>HTML · 4.5.17 The samp element</div>
  <h1>The samp element</h1>
  <p class=pr-lede><q>The samp element represents sample or quoted output from another program or computing system.</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/text-level-semantics.html#the-samp-element">HTML §4.5.17</a></span></p>
</header>
<section>
  <h2>Monospace</h2>
  <p><q>code, kbd, samp, tt { font-family: monospace; }</q> <span class=pr-cite><a href="https://html.spec.whatwg.org/multipage/rendering.html#phrasing-content-3">§15.3.4</a></span></p>
  <figure>
    <div class="pr-stage t">It said <samp>File not found.</samp></div>
    <figcaption>"File not found." in a monospace font.</figcaption>
  </figure>
</section>
</body>
