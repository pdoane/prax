<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>jzczhz()</title>
<link rel=stylesheet href=../shared/page.css>
<style>
  .pr-stage { padding: 10px 0; }
  .sw { display: inline-block; vertical-align: top; width: 40px; height: 40px; margin-left: 10px; }
  .steps { display: block; width: 160px; height: 40px; margin-left: 10px; image-rendering: pixelated; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>CSS Color HDR 1 · 6.5 JzCzhz</div>
  <h1>jzczhz()</h1>
  <p class=pr-lede>JzCzhz is Jzazbz in polar form: lightness J<sub>z</sub>, chroma C<sub>z</sub> and hue h<sub>z</sub>. <span class=pr-cite><a href="https://drafts.csswg.org/css-color-hdr-1/#JzCzhz">CSS Color HDR 1
  §6.5</a></span></p>
</header>

<section>
  <h2>Lime, by hue</h2>
  <figure class=pr-erratum>
    <div class="pr-stage pr-row"><div class=sw style="background: jzczhz(0.17542 0.1614 132.5)"></div><div class=sw style="background: jzazbz(0.17542 -0.1179 0.1092)"></div><div class=sw style="background: lime"></div></div>
    <figcaption><code>jzczhz(0.17542 0.1614 132.5)</code>, then the same color in <code>jzazbz()</code>, then
    <code>lime</code>: one green. <span class=pr-flag>Chrome</span> <span class=pr-flag>Safari</span> <span class=pr-flag>Firefox</span> <code>jzczhz()</code> does not parse, so the swatch has no background.</figcaption>
  </figure>
  <figure class=pr-erratum>
    <div class="pr-stage pr-row"><div class=sw style="background: jzczhz(0.17542 0.1614 12)"></div><div class=sw style="background: jzczhz(0.17542 0.1614 72)"></div><div class=sw style="background: jzczhz(0.17542 0.1614 132)"></div><div class=sw style="background: jzczhz(0.17542 0.1614 192)"></div><div class=sw style="background: jzczhz(0.17542 0.1614 252)"></div><div class=sw style="background: jzczhz(0.17542 0.1614 312)"></div></div>
    <figcaption>Lime's lightness and chroma, turned round the hue circle in steps of 60°: six hues of one lightness.
    <span class=pr-flag>Chrome</span> <span class=pr-flag>Safari</span> <span class=pr-flag>Firefox</span> <code>jzczhz()</code> does not parse, so the swatch has no background.</figcaption>
  </figure>
</section>

</body>
</html>
