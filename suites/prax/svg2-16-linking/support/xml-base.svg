<?xml version="1.0" encoding="UTF-8"?>
<!-- A document whose g sets xml:base to the suite's shared resources, so that the image's relative href resolves
     there, to the flag, 40 by 40 at 60, 10. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="60">
  <g xml:base="../../shared/resources/">
    <image href="flag-40x20.png" x="60" y="10" width="40" height="40" preserveAspectRatio="none" />
  </g>
</svg>
