<?xml version="1.0" encoding="UTF-8"?>
<!-- A document whose HTML link element loads blue.css: its rect is blue if the link applies, orange if not. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="60">
  <link xmlns="http://www.w3.org/1999/xhtml" rel="stylesheet" href="blue.css" />
  <rect x="20" y="10" width="120" height="40" fill="#d68a3c" />
</svg>
