<?xml version="1.0" encoding="UTF-8"?>
<!-- A document whose style element imports blue.css: its rect is blue if the import applies. -->
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="60">
  <style>@import url(blue.css);</style>
  <rect x="20" y="10" width="120" height="40" fill="#d68a3c" />
</svg>
