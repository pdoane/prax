<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Widths: inline-block, replaced elements</title>
<link rel=stylesheet href=../shared/page.css>
<style>
  img { display: inline-block; vertical-align: top; }
</style>
</head>
<body>
<header>
  <div class=pr-eyebrow>CSS 2 · 10.3.10 'Inline-block', replaced elements in normal flow</div>
  <h1>Widths: inline-block, replaced elements</h1>
  <p class=pr-lede>Each purple box is an <code>img</code> with <code>display: inline-block</code>, of an SVG image 60 by
  40 (ratio 3:2).</p>
</header>

<section>
  <h2>Exactly as inline replaced elements</h2>
  <p><q>Exactly as inline replaced elements.</q> <span class=pr-cite><a href="https://drafts.csswg.org/css2/#inlineblock-replaced-width">CSS 2 §10.3.10</a></span></p>
  <figure>
    <div class=pr-stage><img alt="" style="margin: 0 auto" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='40'><rect width='100%' height='100%' fill='%238e44ad'/></svg>"></div>
    <figcaption><code>margin: 0 auto</code>: the intrinsic 60 by 40, at the start of the line, not centered.</figcaption>
  </figure>
  <figure>
    <div class=pr-stage><img alt="" style="height: 20px" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='40'><rect width='100%' height='100%' fill='%238e44ad'/></svg>"></div>
    <figcaption><code>height: 20px</code>: 20 × 3/2 = 30px wide.</figcaption>
  </figure>
</section>

</body>
</html>
