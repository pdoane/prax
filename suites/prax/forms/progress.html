<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Progress</title>
<link rel=stylesheet href=support/gallery.css>
<style>
.grid progress { width: 100px; }
.restyled progress { appearance: none; height: 8px; }
.restyled progress::-webkit-progress-bar { background: #e4c9d6; border-radius: 4px; }
.restyled progress::-webkit-progress-value { background: #c0477a; border-radius: 4px; }
.panel progress { width: 90px; }
.large progress { width: 4em; }
</style>
</head>
<body>
<header>
  <h1>Progress</h1>
  <p>A progress bar is determinate if it has a value, and indeterminate otherwise.</p>
</header>

<section>
  <h2>Values</h2>
<table class=grid>
  <tr><th></th><th>auto</th><th>none</th><th>base</th><th>restyled parts</th></tr>
  <tr><th scope=row>indeterminate</th><td><progress></progress></td><td class=none><progress></progress></td><td class=base><progress></progress></td><td class=restyled><progress></progress></td></tr>
  <tr><th scope=row>0%</th><td><progress value=0></progress></td><td class=none><progress value=0></progress></td><td class=base><progress value=0></progress></td><td class=restyled><progress value=0></progress></td></tr>
  <tr><th scope=row>40%</th><td><progress value=0.4></progress></td><td class=none><progress value=0.4></progress></td><td class=base><progress value=0.4></progress></td><td class=restyled><progress value=0.4></progress></td></tr>
  <tr><th scope=row>100%</th><td><progress value=7 max=7></progress></td><td class=none><progress value=7 max=7></progress></td><td class=base><progress value=7 max=7></progress></td><td class=restyled><progress value=7 max=7></progress></td></tr>
</table>
</section>

<section>
  <h2>In context</h2>
<div class=panels>
  <div class="panel light"><span class=cap>light</span><div class=strip><progress value=0.4></progress> <progress></progress></div></div>
  <div class="panel dark"><span class=cap>dark</span><div class=strip><progress value=0.4></progress> <progress></progress></div></div>
  <div class="panel accent"><span class=cap>accent-color</span><div class=strip><progress value=0.4></progress> <progress></progress></div></div>
  <div class="panel large"><span class=cap>font-size: 24px</span><div class=strip><progress value=0.4></progress> <progress></progress></div></div>
  <div class=panel dir=rtl><span class=cap>rtl</span><div class=strip><progress value=0.3></progress></div></div>
  <div class="panel vertical"><span class=cap>vertical-lr</span><progress value=0.3></progress></div>
</div>
</section>
</body>
</html>
